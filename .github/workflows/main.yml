name: Generate JioTV M3U5

on:
  schedule:
    - cron: '0 */6 * * *'  # ਹਰ 6 ਘੰਟੇ ਬਾਅਦ ਚੱਲੇਗਾ
  workflow_dispatch:      # ਹੱਥੀਂ (Manually) ਚਲਾਉਣ ਲਈ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Run Python Bot
      run: |
        python bot.py

    - name: Commit and Push M3U File
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "bot@github.com"
        # ਇੱਥੇ ਚੈੱਕ ਕਰਦਾ ਹੈ ਕਿ ਕੀ myjiotv.m3u ਫ਼ਾਈਲ ਵਿੱਚ ਕੋਈ ਬਦਲਾਅ ਹੋਇਆ ਹੈ
        if [ -n "$(git status --porcelain)" ]; then
          git add myjiotv.m3u
          git commit -m "Auto-update myjiotv.m3u playlist"
          git push
        else
          echo "No changes to commit."
        fi
