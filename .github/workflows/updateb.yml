name: Update b Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # ਹਰ 6 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਅਪਡੇਟ ਹੋਵੇਗਾ

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download and Modify Playlist using Curl
        run: |
          # ਸਿੱਧੀ ਕਲ ਨਾਲ ਡਾਊਨਲੋਡ ਕਰੋ ਅਤੇ ਨਾਲ ਹੀ ਨਾਂ ਬਦਲੋ
          curl -s "https://game.denver69.fun/Jtv/EiWIY4/Playlist.m3u" | sed 's/billed-msg="[^"]*"/billed-msg="Playlist Generated by Khehra"/g' > channels.m3u

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-update playlist via curl'
          file_pattern: channels.m3u
