name: Updateb Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # ਹਰ 6 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਅਪਡੇਟ ਹੋਵੇਗਾ

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download and Modify Playlist
        run: |
          # Playlist download ਕਰੋ ਅਤੇ billed-msg update ਕਰੋ
          curl -s "https://game.denver69.fun/Jtv/ckF0uK/Playlist.m3u" | \
          sed 's/billed-msg="[^"]*"/billed-msg="Playlist Generated by Khehra"/g' > channels.m3u

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-update playlist'
          file_pattern: channels.m3u
