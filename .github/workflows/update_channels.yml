name: Auto Fetch DishTV LCN List

on:
  workflow_dispatch: # ਇਸ ਨਾਲ ਤੁਸੀਂ ਬਟਨ ਦਬਾ ਕੇ ਮੈਨੂਅਲ ਵੀ ਚਲਾ ਸਕੋਗੇ
  schedule:
    - cron: '0 0 * * *' # ਹਰ ਰੋਜ਼ ਰਾਤ ਨੂੰ 12 ਵਜੇ ਆਟੋਮੈਟਿਕ ਚੱਲੇਗਾ

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Python Script
        run: |
          python3 smart_hybrid_fetcher.py

      - name: Commit and Push Updated List
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add dishtv_lcn_list.txt
          git commit -m "Auto-update DishTV LCN list" || exit 0
          git push
