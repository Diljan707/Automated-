name: Generate JioTV M3U Every 30 Mins

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run M3U Generator Script
        run: |
          python main.py

      - name: Check Generated Files (Debug Step)
        run: |
          echo "📁 Current repository files:"
          ls -la

      - name: Commit & Push Generated M3U
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # ਸਹੀ ਫ਼ਾਈਲ ਨਾਂ ਜੋੜਿਆ ਗਿਆ ਹੈ
          git add myjiotv.m3u

          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected in myjiotv.m3u. Skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(m3u): auto-update myjiotv.m3u [$TIMESTAMP]"
            git push origin main
            echo "✅ Changes pushed successfully."
          fi
