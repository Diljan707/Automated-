name: Generate JioTV M3U Every 30 Mins

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run M3U Generator Script
        run: |
          python main.py

      - name: Commit & Push Generated M3U
        run: |
          git config user.name "m3u-bot"
          git config user.email "m3u-bot@users.noreply.github.com"

          git add myjio.m3u

          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected in myjio.m3u. Skipping commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(m3u): auto-update myjio.m3u [$TIMESTAMP]"
            git push
            echo "✅ Changes pushed successfully."
          fi
